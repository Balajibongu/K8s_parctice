apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: statefulset
  labels:
    names: roboshop
    env: dev
spec:
  serviceName: "headless"
  replicas: 2
  selector:
    matchLabels:
      names: roboshop
      env: dev
  template:
    metadata:
      labels:
        names: roboshop
        env: dev
    spec:
      containers:
      - name: nginx
        image: nginx:trixie-perl
        resources:
          requests:
            cpu: "150mm"
            memory: "256Mi"
          limits:
            cpu: "200mm"
            memory: "256Mi"
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: nginx-html
    nodeSelector:
      topology.kubernetes.io/zone: us-east-1c
  volumeClaimTemplates:
  - metadata:
      name: nginx-html
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ebs-sc"
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: headless
spec:
  clusterIP: None
  selector:
    names: roboshop
    env: dev
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: clusterip
spec:
  type: clusterIP
  selector:
    names: roboshop
    env: dev
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80