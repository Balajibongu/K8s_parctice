apiVersion: v1
kind: Pod

metadata:
  name: emptydir
  # namespace: roboshop
  labels:
    name: roboshop
    env: dev

spec:
  containers:
    - name: nginx
      image: nginx:alpine
      volumeMounts:
        - mountPath: /var/log/nginx
          name: nginx-log

    - name: almalinux
      image: almalinux:8
      command: ["sleep", "1000"]
      volumeMounts:
        - mountPath: /sample/nginx
          name: nginx-log
          readOnly: true

  volumes:
    - name: nginx-log
      emptyDir:
        sizeLimit: 100Mi