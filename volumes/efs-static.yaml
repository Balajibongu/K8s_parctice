apiVersion: v1
kind: PersistentVolume
metadata: 
  name: efs-pv
spec: 
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 15Gi
  csi:
    driver: efs.csi.aws.com
    fsType: ext4
    volumeHandle: fs-08d7a6e0d69e1b3d0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-pvc 
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ""
  volumeName: efs-pv 
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: Pod
metadata: 
  name: efs-pod
  labels:
    name: roboshop
spec: 
  containers:
  - name: nginx
    image: nginx:alpine
    volumeMounts:
    - name: nginx-efs
      mountPath: /usr/share/nginx/html
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1b
  volumes:
  - name: nginx-efs
    persistentVolumeClaim:
      claimName: efs-pvc 
---
apiVersion: v1
kind: Service
metadata:
  name: pod-service
spec: 
  type: LoadBalancer
  selector:
    name: roboshop
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30007