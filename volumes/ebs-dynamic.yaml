apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-pvc
spec:
  accessModes: 
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-pod
  labels:
    name: roboshop
spec:
  containers:
  - name: nginx
    image: nginx
    ports:
    - containerPort: 80
    volumeMounts:
    - name: nginx-html
      mountPath: /usr/share/nginx/html
  volumes:
  - name: nginx-html
    persistentVolumeClaim:
      claimName: ebs-pvc
---
apiVersion: v1
kind: Service 
metadata:
  name: ebs-service 
spec:
  type: LoadBalancer
  selector:
    name: roboshop
  ports:
  -   protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port
      nodePort: 30007 
