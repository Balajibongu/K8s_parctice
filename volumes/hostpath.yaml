apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: hostpath
  labels:
    name: roboshop
    env: dev

spec:
  selector:
    matchLabels:
      name: roboshop
      env: dev

  template:
    metadata:
      labels:
        name: roboshop
        env: dev

    spec:
      tolerations:
        # These tolerations allow the DaemonSet to run on control-plane nodes
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule

      terminationGracePeriodSeconds: 30

      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

          resources:
            limits:
              cpu: 50m
              memory: 100Mi
            requests:
              cpu: 50m
              memory: 100Mi

          volumeMounts:
            - mountPath: /var/log
              name: nginx-log
              readOnly: true

      volumes:
        - name: nginx-log
          hostPath:
            path: /var/log