apiVersion: apps/v1
kind: Deployment
metadata: 
  name: deployment
  labels:
    name: roboshop
    env: dev
    language: yaml
    purpose: deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      name: roboshop
      env: dev
      language: yaml
      purpose: deployment
  template:
    metadata:
      labels:
        name: roboshop
        env: dev
        language: yaml
        purpose: deployment
    spec:
      containers:
      - name: nginx
        image: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: deployment
spec:
  type: LoadBalancer
  selector:
    name: roboshop
    env: dev
    language: yaml
    purpose: deployment
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
